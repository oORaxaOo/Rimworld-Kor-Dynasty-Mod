name: Validate KOR Dynasty Mod

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate mod XML and metadata
        run: python3 tools/validate_mod.py
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -v
